name: Build & Release Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Package & Publish Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Signed APK
        run: |
          mkdir -p dist
          if [ -f apk/KaatibDocsPro.apk ]; then
            cp apk/KaatibDocsPro.apk dist/KaatibDocsPro.apk
            echo "Using pre-built signed KaatibDocsPro.apk"
          else
            echo "Pre-built APK not found, attempting Gradle build..."
            if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
              tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
            fi
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk dist/KaatibDocsPro.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaatibDocsPro-APK
          path: dist/KaatibDocsPro.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-latest
          name: "KaatibDocsPro APK (جاهز للتثبيت على الهاتف)"
          body: |
            ### تحميل تطبيق KaatibDocsPro للأندرويد 📱
            - اضغط على ملف **`KaatibDocsPro.apk`** أدناه في قسم **Assets** لتحميل التطبيق مباشرة إلى هاتفك وتثبيته.
          files: dist/KaatibDocsPro.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
